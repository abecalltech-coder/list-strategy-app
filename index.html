<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>リスト戦略システム</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>リスト戦略システム</h1>
    <div class="header-right">
      <span id="status" class="status">読み込み中...</span>
      <button id="refresh-btn" class="btn-primary">🔄 再読み込み</button>
    </div>
  </header>

  <section class="global-controls">
    <div class="control-block">
      <div class="control-label">エリアで表示切替(ワンクリックでそのエリアのシートだけに絞り込み)</div>
      <div id="area-switcher" class="chip-row"></div>
    </div>
    <div class="control-block">
      <div class="control-label">対象シート(個別に組み合わせて選択も可能・サマリーと詳細データ両方に反映)</div>
      <div id="sheet-selector" class="chip-row"></div>
    </div>
    <div class="control-block">
      <div class="control-label">
        都道府県で絞り込み
        <button id="pref-select-all" class="btn-link">全選択</button>
        <button id="pref-select-none" class="btn-link">全解除</button>
      </div>
      <div id="pref-filter" class="chip-row"></div>
    </div>
    <div class="control-block">
      <div class="control-label">サマリー(エリアレポート)の設定</div>
      <div class="agg-controls">
        <button id="report-expand-all" class="btn-link">すべて展開</button>
        <button id="report-collapse-all" class="btn-link">すべて折りたたむ</button>
        <span class="report-inline-label">残量として使う列:</span>
        <select id="report-remaining-column"></select>
        <span class="report-inline-label">リスト累計数として使う列(有効率の分母):</span>
        <select id="report-total-column"></select>
        <span class="report-inline-label">トスアップ列:</span>
        <select id="report-tossup-column"></select>
        <span class="report-inline-label">アポ(獲得)列:</span>
        <select id="report-appo-column"></select>
        <details class="col-picker">
          <summary>表示する列を選択 ▾</summary>
          <div id="report-extra-columns" class="cat-options col-picker-panel"></div>
        </details>
      </div>
    </div>
  </section>

  <nav class="main-tabs">
    <button class="main-tab-btn active" data-tab="summary">サマリー(エリアレポート)</button>
    <button class="main-tab-btn" data-tab="detail">詳細データ</button>
  </nav>

  <main>
    <section id="tab-summary" class="main-tab-panel active">
      <div id="summary-panel"></div>
    </section>

    <section id="tab-detail" class="main-tab-panel">
      <div id="detail-sheet-tabs" class="tab-row"></div>
      <div id="detail-panel"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
