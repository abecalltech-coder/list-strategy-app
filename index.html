<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Listgram</title>
<meta name="application-name" content="Listgram" />
<meta name="apple-mobile-web-app-title" content="Listgram" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Listgram</h1>
    <div class="header-right">
      <span id="status" class="status">読み込み中...</span>
      <button id="refresh-btn" class="btn-primary">🔄 再読み込み</button>
    </div>
  </header>

  <section class="global-controls">
    <div class="control-block">
      <div class="control-label">エリアで表示切替(ワンクリックでそのエリアのシートだけに絞り込み)</div>
      <div id="area-switcher" class="chip-row"></div>
    </div>
    <div class="control-block">
      <div class="control-label">対象シート(個別に組み合わせて選択も可能・集計と詳細データ両方に反映)</div>
      <details class="col-picker">
        <summary>シートを選択 ▾</summary>
        <div id="sheet-selector" class="col-picker-panel"></div>
      </details>
    </div>
    <div class="control-block">
      <div class="control-label">
        都道府県で絞り込み
        <button id="pref-select-all" class="btn-link">全選択</button>
        <button id="pref-select-none" class="btn-link">全解除</button>
      </div>
      <details class="col-picker">
        <summary>都道府県を選択 ▾</summary>
        <div id="pref-filter" class="cat-options col-picker-panel"></div>
      </details>
    </div>
  </section>

  <nav class="main-tabs">
    <button class="main-tab-btn" data-tab="analysis">分析</button>
    <button class="main-tab-btn active" data-tab="summary">集計</button>
    <button class="main-tab-btn" data-tab="detail">詳細データ</button>
  </nav>

  <main>
    <section id="tab-analysis" class="main-tab-panel">
      <div class="tab-row">
        <button id="analysis-mode-week" class="tab-btn active">週次</button>
        <button id="analysis-mode-weekday" class="tab-btn">曜日別</button>
        <button id="analysis-expand-all" class="btn-link">すべて展開</button>
        <button id="analysis-collapse-all" class="btn-link">すべて折りたたむ</button>
      </div>
      <div id="analysis-panel"></div>
    </section>

    <section id="tab-summary" class="main-tab-panel active">
      <div class="tab-row">
        <button id="report-expand-all" class="btn-link">すべて展開</button>
        <button id="report-collapse-all" class="btn-link">すべて折りたたむ</button>
      </div>
      <div id="summary-panel"></div>
    </section>

    <section id="tab-detail" class="main-tab-panel">
      <div id="detail-sheet-tabs" class="tab-row"></div>
      <div id="detail-panel"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
